name: CI

on:
  push:
    branches: [master]
  pull_request:

defaults:
  run:
    working-directory: klaar
env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gate:
    name: Quality gate (fmt, clippy, tests)
    runs-on: ubuntu-latest
    services:
      # klaar-api refuse désormais de démarrer sans base : un service qui
      # démarre « vert » puis rejette toutes les requêtes est plus coûteux à
      # diagnostiquer qu'un service qui refuse de démarrer. Les tests
      # d'intégration en ont besoin pour la même raison, ON CONFLICT et les
      # contraintes d'unicité n'existant pas dans un double en mémoire.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: klaar
          POSTGRES_PASSWORD: klaar_dev_only
          POSTGRES_DB: klaar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U klaar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://klaar:klaar_dev_only@localhost:5433/klaar
      # Secret de CI, jeté à la fin du job. klaar-api refuse de démarrer
      # sans lui (Story 1.3) : en générer un à la volée invaliderait toutes
      # les sessions à chaque redémarrage sans que personne ne comprenne.
      KLAAR_JWT_SECRET: secret-de-ci-jamais-utilise-en-production-48o
      # Scellement de la trace de matching (Story 3.8, AI Act art. 12). Sans
      # elle, la trace s'écrit non signée : les tests qui vérifient la chaîne
      # passeraient sans rien prouver.
      KLAAR_TRACE_HMAC_KEY: cle-de-ci-pour-la-trace-jamais-en-production-48o
      # Web Push et Stripe, configurés **exprès** pour ce job. Sans eux,
      # `GET /api/v1/push/cle-publique` et `POST /api/v1/webhooks/stripe`
      # rendent un 503 « non configuré » — une réponse juste, mais que le fuzz
      # de contrat compte comme une erreur serveur et qui masquait donc l'état
      # réel des deux routes. Valeurs de test, sans effet hors de ce job.
      KLAAR_VAPID_PRIVATE_KEY: bAdZudffXubX14YgJQxCQEP-6shwedfcTPM5EaUJD3U
      KLAAR_VAPID_SUBJECT: mailto:ci@klaar.invalid
      KLAAR_STRIPE_WEBHOOK_SECRET: whsec_de_ci_jamais_en_production
      # `target/` dépasse trente gigaoctets avec la compilation incrémentale,
      # pour un gain nul sur un runner qui repart de zéro à chaque job.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # **Le disque de l'exécutant, avant tout le reste.** L'édition de liens
      # de `cargo test --workspace` a échoué sur
      # « ld terminated with signal 7 [Bus error] » — la signature d'un disque
      # plein, reproduite à l'identique en local dans les mêmes conditions.
      # Ce job compile la caisse entière **plus un binaire de test par
      # fichier d'intégration**, et le moindre changement de `Cargo.lock`
      # invalide le cache de compilation : on repart alors de zéro sur les
      # quatorze gigaoctets libres d'un exécutant standard.
      #
      # Les trois répertoires retirés sont des chaînes d'outils que ce projet
      # n'emploie pas — .NET, Android, Haskell — et représentent une vingtaine
      # de gigaoctets. `df` encadre l'opération : le jour où ce n'est plus le
      # disque, la sortie le dira au lieu de laisser chercher.
      - name: Fait de la place (l'édition de liens échouait faute de disque)
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klaar
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Applique les migrations
        run: cargo run -p klaar-api --bin klaar-migrate
      - run: cargo test --workspace
      - name: Disque restant après les tests
        if: always()
        run: df -h /

  msrv:
    name: MSRV (rust-version de Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lit la MSRV déclarée
        id: msrv
        run: echo "version=$(grep '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klaar
      # Une MSRV déclarée mais jamais compilée est une fiction. Elle l'était :
      # Cargo.toml annonçait 1.85 alors que l'arbre de dépendances exige 1.88.
      - run: cargo check --workspace

  security-gate:
    name: Security gate (audit, deny, secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klaar
      - name: cargo audit (vulnérabilités connues)
        # RUSTSEC-2026-0258 (h2 < 0.4.16, DoS par frames DATA vides) ignorée :
        # transitive via actix-http (toute la branche h2 0.3.x d'actix-web v4
        # en hérite, pas de version corrigée disponible en amont à ce jour).
        # klaar-api n'est pas encore exposé publiquement (Sprint 0). À retirer
        # dès qu'actix-web publie un correctif — revoir à chaque bump de
        # dépendance (voir klaar/README.md).
        #
        # RUSTSEC-2023-0071 (rsa 0.9.10, attaque Marvin) ignorée pour une
        # raison plus forte : **ce code n'est jamais construit**. `rsa` n'est
        # atteignable que par `sqlx-mysql`, pilote qu'une application
        # PostgreSQL n'active pas. `cargo audit` lit `Cargo.lock`, qui
        # enregistre les dépendances optionnelles qu'elles soient activées ou
        # non — retirer la fonctionnalité `macros` de sqlx ne l'en sort pas,
        # essayé et vérifié. Ce qui se vérifie, en revanche :
        #
        #   cargo tree -i rsa --workspace --target all   # « nothing to print »
        #   ls target/debug/deps | grep -E 'librsa-|libsqlx_mysql-'  # vide
        #
        # À revoir si une version corrigée paraît, ou si un pilote MySQL est
        # un jour activé — auquel cas l'avis redeviendrait réel.
        run: |
          cargo install cargo-audit --locked
          cargo audit --ignore RUSTSEC-2026-0258 --ignore RUSTSEC-2023-0071
      - name: cargo deny (licences, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: klaar/Cargo.toml
      - name: gitleaks (secrets)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract-tests:
    name: Contrat API (schemathesis)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    services:
      # klaar-api refuse désormais de démarrer sans base : un service qui
      # démarre « vert » puis rejette toutes les requêtes est plus coûteux à
      # diagnostiquer qu'un service qui refuse de démarrer. Les tests
      # d'intégration en ont besoin pour la même raison, ON CONFLICT et les
      # contraintes d'unicité n'existant pas dans un double en mémoire.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: klaar
          POSTGRES_PASSWORD: klaar_dev_only
          POSTGRES_DB: klaar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U klaar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://klaar:klaar_dev_only@localhost:5433/klaar
      # Secret de CI, jeté à la fin du job. klaar-api refuse de démarrer
      # sans lui (Story 1.3) : en générer un à la volée invaliderait toutes
      # les sessions à chaque redémarrage sans que personne ne comprenne.
      KLAAR_JWT_SECRET: secret-de-ci-jamais-utilise-en-production-48o
      # Scellement de la trace de matching (Story 3.8, AI Act art. 12). Sans
      # elle, la trace s'écrit non signée : les tests qui vérifient la chaîne
      # passeraient sans rien prouver.
      KLAAR_TRACE_HMAC_KEY: cle-de-ci-pour-la-trace-jamais-en-production-48o
      # `target/` dépasse trente gigaoctets avec la compilation incrémentale,
      # pour un gain nul sur un runner qui repart de zéro à chaque job.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klaar
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install schemathesis
      - name: Compile klaar-api à l'avance (le run à froid en CI dépasse le délai d'attente de schemathesis)
        run: cargo build -p klaar-api --bin klaar-api
      - name: Applique les migrations
        run: cargo run -p klaar-api --bin klaar-migrate
      - name: Démarre klaar-api en arrière-plan
        run: cargo run -p klaar-api --bin klaar-api &
      - name: Fuzz le contrat API (schemathesis, ADR-004)
        # `unsupported_method` n'est plus exclu : l'API rend désormais un 405
        # assorti d'un `Allow` sur un chemin connu appelé avec un verbe non
        # déclaré, au lieu du 404 que produit le routage par macro
        # d'actix-web. Le repli est dans `klaar_api::configurer`, et
        # `tests/repli_routes.rs` le vérifie.
        # --wait-for-schema : laisse le temps au binaire de démarrer (déjà
        # compilé à l'étape précédente, donc quelques secondes suffisent).
        run: st run http://127.0.0.1:8080/api/v1/openapi.json --wait-for-schema=30 --checks all

  codegen:
    name: Codegen TS client (@klaar/client)
    runs-on: ubuntu-latest
    needs: [quality-gate]
    services:
      # klaar-api refuse désormais de démarrer sans base : un service qui
      # démarre « vert » puis rejette toutes les requêtes est plus coûteux à
      # diagnostiquer qu'un service qui refuse de démarrer. Les tests
      # d'intégration en ont besoin pour la même raison, ON CONFLICT et les
      # contraintes d'unicité n'existant pas dans un double en mémoire.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: klaar
          POSTGRES_PASSWORD: klaar_dev_only
          POSTGRES_DB: klaar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U klaar"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://klaar:klaar_dev_only@localhost:5433/klaar
      # Secret de CI, jeté à la fin du job. klaar-api refuse de démarrer
      # sans lui (Story 1.3) : en générer un à la volée invaliderait toutes
      # les sessions à chaque redémarrage sans que personne ne comprenne.
      KLAAR_JWT_SECRET: secret-de-ci-jamais-utilise-en-production-48o
      # Scellement de la trace de matching (Story 3.8, AI Act art. 12). Sans
      # elle, la trace s'écrit non signée : les tests qui vérifient la chaîne
      # passeraient sans rien prouver.
      KLAAR_TRACE_HMAC_KEY: cle-de-ci-pour-la-trace-jamais-en-production-48o
      # `target/` dépasse trente gigaoctets avec la compilation incrémentale,
      # pour un gain nul sur un runner qui repart de zéro à chaque job.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klaar
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Applique les migrations
        run: cargo run -p klaar-api --bin klaar-migrate
      - run: bash scripts/codegen.sh
      - name: Vérifie que le client a bien été régénéré
        run: test -s packages/klaar-client/src/schema.d.ts

  sbom:
    name: SBOM CycloneDX + provenance
    runs-on: ubuntu-latest
    needs: [quality-gate, security-gate]
    # id-token: write — signature cosign keyless (Sigstore/Fulcio via OIDC
    # GitHub), pas de clé privée à gérer ni de secret à faire fuiter.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: klaar
      - name: Génère le SBOM (ADR-005, préparation CRA — Story 0.10)
        run: |
          cargo install cargo-cyclonedx --locked
          cargo cyclonedx --all --format json
      - uses: sigstore/cosign-installer@v3
      - name: Signe chaque SBOM (provenance style SLSA)
        run: |
          for f in $(find . -name '*.cdx.json'); do
            cosign sign-blob --yes --output-signature "$f.sig" --output-certificate "$f.pem" "$f"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: |
            klaar/**/*.cdx.json
            klaar/**/*.cdx.json.sig
            klaar/**/*.cdx.json.pem

  frontend:
    name: PWA (build, tests, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: klaar/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: klaar/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Contrôle de types + build statique
        run: npm run build
      - name: Tests unitaires (queue hors-ligne, 4 classes)
        run: npm run test
      - run: npx playwright install --with-deps chromium
      # **Un affichage est nécessaire, pour une partie des cas seulement.**
      # Chromium sans affichage n'a pas de service de notification :
      # `Notification.permission` rend « denied » alors même que la permission
      # a été accordée, et les six cas de `push.spec.ts` échouaient sur cette
      # capacité absente plutôt que sur le code. `npm run test:e2e` fournit un
      # serveur X virtuel quand il n'y en a pas (`scripts/e2e.mjs`) ; sans
      # `xvfb`, il saute ces cas **en le disant**, ce qui donnerait un job vert
      # ayant vérifié moins qu'il n'y paraît. On l'installe donc explicitement.
      - name: Serveur X virtuel (tests de notifications)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Tests e2e (installabilité, service worker, hors-ligne, navigation, notifications)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: klaar/web/playwright-report/
