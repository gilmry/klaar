global:
  scrape_interval: 10s

scrape_configs:
  - job_name: klaar-api
    static_configs:
      # host.docker.internal : klaar-api tourne en process natif (cargo run),
      # pas dans ce compose — cohérent avec docker-compose.yml (Postgres
      # seul y est conteneurisé, Story 0.3).
      - targets: ["host.docker.internal:8080"]
