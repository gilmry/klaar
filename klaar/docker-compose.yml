services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: klaar
      POSTGRES_PASSWORD: klaar_dev_only
      POSTGRES_DB: klaar
    ports:
      # 5433 et non 5432 : un poste qui héberge plusieurs projets ne doit pas
      # les faire se disputer le port par défaut. KLAAR_PG_PORT permet d'en
      # choisir un autre sans modifier ce fichier.
      - "${KLAAR_PG_PORT:-5433}:5432"
    volumes:
      - klaar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      # `-h 127.0.0.1` : au premier démarrage, l'image officielle lance un
      # serveur temporaire pour initialiser le répertoire de données, qui
      # n'écoute que sur le socket Unix. `pg_isready` sans hôte le trouve et
      # déclare la base saine alors que le vrai serveur n'écoute pas encore.
      # Ici le service est lancé à la main, donc la faiblesse ne se voyait pas —
      # elle mordrait au premier service ajouté qui dépend de la base.
      test: ["CMD-SHELL", "pg_isready -U klaar -d klaar -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Story 0.8 — observabilité. klaar-api tourne en process natif (pas dans ce
  # compose) ; Prometheus le scrape via host.docker.internal.
  prometheus:
    image: prom/prometheus:v2.53.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: klaar_dev_only
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  klaar-postgres-data:
