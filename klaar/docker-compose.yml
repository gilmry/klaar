services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: klaar
      POSTGRES_PASSWORD: klaar_dev_only
      POSTGRES_DB: klaar
    ports:
      - "5432:5432"
    volumes:
      - klaar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U klaar"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Story 0.8 — observabilité. klaar-api tourne en process natif (pas dans ce
  # compose) ; Prometheus le scrape via host.docker.internal.
  prometheus:
    image: prom/prometheus:v2.53.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: klaar_dev_only
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  klaar-postgres-data:
