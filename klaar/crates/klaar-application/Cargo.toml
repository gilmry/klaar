[package]
name = "klaar-application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
klaar-shared-kernel = { path = "../klaar-shared-kernel", version = "0.0.0" }
klaar-stripe-adapter = { path = "../klaar-stripe-adapter", version = "0.0.0" }
rand = "0.9"
serde.workspace = true
serde_json.workspace = true
klaar-identity = { path = "../klaar-identity", version = "0.0.0" }
klaar-catalog = { path = "../klaar-catalog", version = "0.0.0" }
klaar-matching = { path = "../klaar-matching", version = "0.0.0" }
klaar-intervention = { path = "../klaar-intervention", version = "0.0.0" }
klaar-payment = { path = "../klaar-payment", version = "0.0.0" }
klaar-messaging = { path = "../klaar-messaging", version = "0.0.0" }
klaar-trust = { path = "../klaar-trust", version = "0.0.0" }
uuid.workspace = true
chrono.workspace = true
# Uniquement pour signaler les replis et les échecs non bloquants. Aucune
# décision métier ne dépend de la journalisation.
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
