[package]
name = "klaar-email-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# Même client que l'adaptateur de notifications, et mêmes options TLS : c'est
# un client de plus dans l'arbre de dépendances qu'on évite, pas un caprice.
awc = { version = "3", features = ["rustls-0_23-webpki-roots"] }
serde.workspace = true
serde_json.workspace = true
klaar-shared-kernel = { path = "../klaar-shared-kernel", version = "0.0.0" }
klaar-application = { path = "../klaar-application", version = "0.0.0" }
klaar-identity = { path = "../klaar-identity", version = "0.0.0" }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
