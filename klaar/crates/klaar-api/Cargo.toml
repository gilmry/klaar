[package]
name = "klaar-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
klaar-application = { path = "../klaar-application", version = "0.0.0" }
klaar-identity = { path = "../klaar-identity", version = "0.0.0" }
klaar-catalog = { path = "../klaar-catalog", version = "0.0.0" }
klaar-shared-kernel = { path = "../klaar-shared-kernel", version = "0.0.0" }
klaar-sqlx-repos = { path = "../klaar-sqlx-repos", version = "0.0.0" }
klaar-stripe-adapter = { path = "../klaar-stripe-adapter", version = "0.0.0" }
klaar-itsme-adapter = { path = "../klaar-itsme-adapter", version = "0.0.0" }
klaar-geo-adapter = { path = "../klaar-geo-adapter", version = "0.0.0" }
klaar-push-adapter = { path = "../klaar-push-adapter", version = "0.0.0" }
klaar-storage-adapter = { path = "../klaar-storage-adapter", version = "0.0.0" }
klaar-av-adapter = { path = "../klaar-av-adapter", version = "0.0.0" }
klaar-audit-adapter = { path = "../klaar-audit-adapter", version = "0.0.0" }
klaar-email-adapter = { path = "../klaar-email-adapter", version = "0.0.0" }
refinery = { version = "0.8", features = ["tokio-postgres"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tokio-postgres = "0.7"
actix-web = "4"
serde.workspace = true
utoipa = { version = "5", features = ["actix_extras"] }
utoipa-swagger-ui = { version = "9", features = ["actix-web"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-actix-web = "0.7"
actix-web-prom = "0.9"
uuid.workspace = true
serde_json = "1"
chrono.workspace = true
sha2 = "0.10"
jsonwebtoken = "9"
base64 = "0.22"

[[bin]]
name = "klaar-api"
path = "src/main.rs"

[[bin]]
name = "klaar-migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "klaar-vapid"
path = "src/bin/vapid.rs"

# Story 1.9 — exécution différée des effacements. Binaire à planifier, et non
# tâche de fond du serveur : une tâche de fond tourne autant de fois qu'il y a
# d'exemplaires, et se tait quand le serveur redémarre au mauvais moment.
[[bin]]
name = "klaar-effacer"
path = "src/bin/effacer.rs"

# Story 3.6 — fin des tours de diffusion (FR-015). À lancer toutes les dix
# secondes : un tour dure trente secondes, et un balayage trop espacé laisserait
# des demandeurs attendre une nouvelle qui tient en une phrase.
[[bin]]
name = "klaar-expirer"
path = "src/bin/expirer.rs"

# Story 1.6 (partielle) — prestataires de démonstration, sans contrôle BCE.
# Un binaire hors ligne et non un endpoint : une route d'activation, même
# protégée, serait une route qu'on peut oublier d'enlever.
[[bin]]
name = "klaar-prestataires-demo"
path = "src/bin/prestataires_demo.rs"

[dev-dependencies]
# Les constantes du domaine — rayons successifs, limite d'élargissements — pour
# que les tests d'API assertent sur elles plutôt que sur des chiffres recopiés
# qui divergeraient sans que rien ne le signale.
klaar-matching = { path = "../klaar-matching", version = "0.0.0" }
actix-rt = "2"
# Pour lancer deux requêtes réellement concurrentes sur le même jeton et
# vérifier que le verrou tient.
futures-util = "0.3"
# Le type de requête que `test::call_service` attend, pour écrire une fonction
# d'aide générique sur le service monté.
actix-http = "3"
# Les tests d'intégration lisent la base directement pour vérifier ce que
# la route a réellement écrit, et non ce qu'elle prétend avoir écrit.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "macros",
] }
