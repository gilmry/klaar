[package]
name = "klaar-itsme-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
klaar-shared-kernel = { path = "../klaar-shared-kernel", version = "0.0.0" }
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
# Vérification de la signature du jeton d'identité. La clé vient du JWKS
# d'itsme ; c'est notre vérification qui est ici, pas leur clé.
jsonwebtoken = "9"
