[package]
name = "klaar-push-adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
klaar-shared-kernel = { path = "../klaar-shared-kernel", version = "0.0.0" }
klaar-application = { path = "../klaar-application", version = "0.0.0" }
# Primitives RustCrypto. Le protocole (RFC 8188/8291/8292) est assemblé ici et
# vérifié contre les vecteurs du RFC ; les primitives elles-mêmes ne sont pas
# réécrites.
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
serde.workspace = true
serde_json = "1"
awc = { version = "3", features = ["rustls-0_23-webpki-roots"] }
