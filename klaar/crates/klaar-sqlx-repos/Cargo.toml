[package]
name = "klaar-sqlx-repos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
klaar-shared-kernel = { path = "../klaar-shared-kernel", version = "0.0.0" }
klaar-application = { path = "../klaar-application", version = "0.0.0" }
klaar-identity = { path = "../klaar-identity", version = "0.0.0" }
klaar-catalog = { path = "../klaar-catalog", version = "0.0.0" }
klaar-matching = { path = "../klaar-matching", version = "0.0.0" }
klaar-intervention = { path = "../klaar-intervention", version = "0.0.0" }
klaar-payment = { path = "../klaar-payment", version = "0.0.0" }
klaar-trust = { path = "../klaar-trust", version = "0.0.0" }
# Signature chaînée de la trace de matching (AI Act art. 12, Story 3.8).
klaar-audit-adapter = { path = "../klaar-audit-adapter", version = "0.0.0" }
# ADR-002 : sqlx en SQL pur, pas d'ORM. Les requêtes sont vérifiées à
# l'exécution (`query_as`) et non par macro : la vérification par macro
# imposerait une base joignable à la compilation, donc en CI et sur tout poste
# de développement, pour un gain qui ne couvre pas le typage des lignes ici.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "postgres",
    "uuid",
    "chrono",
    "macros",
] }
uuid.workspace = true
chrono.workspace = true
# La ventilation du score est conservée en JSON : les critères changeront, et
# une migration par changement de pondération rendrait l'historique illisible.
serde_json = "1"
# Les agrégats d'audit se sérialisent en JSON pour le rapport (Story 3.8).
serde = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
