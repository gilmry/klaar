# Story 0.4 — cargo-deny : licences, advisories, doublons de dépendances.
# ADR-005 : code Klaar propriétaire, mais les dépendances tierces restent
# open source — seules des licences permissives/copyleft faible sont admises.

[graph]
targets = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    # h2 < 0.4.16, DoS par frames DATA vides. Transitif via actix-http
    # (toute la branche h2 0.3.x d'actix-web v4 en hérite) ; pas de version
    # corrigée disponible en amont. klaar-api n'est pas exposé publiquement à
    # ce stade (Sprint 0). À revoir à chaque bump de dépendance — cf.
    # klaar/README.md.
    "RUSTSEC-2026-0258",
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # `webpki-roots` distribue le magasin de certificats racines de Mozilla
    # sous cette licence de **données**, pas de code : elle autorise l'usage,
    # la redistribution et la modification, sans réciprocité. Elle arrive par
    # `actix-tls` et `sqlx-core`, c'est-à-dire par le TLS des deux côtés du
    # service. La refuser reviendrait à refuser d'embarquer la liste des
    # autorités de certification.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
