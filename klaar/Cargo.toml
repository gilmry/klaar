[workspace]
resolver = "2"
members = [
    "crates/klaar-shared-kernel",
    "crates/klaar-identity",
    "crates/klaar-catalog",
    "crates/klaar-matching",
    "crates/klaar-intervention",
    "crates/klaar-payment",
    "crates/klaar-messaging",
    "crates/klaar-trust",
    "crates/klaar-application",
    "crates/klaar-sqlx-repos",
    "crates/klaar-stripe-adapter",
    "crates/klaar-itsme-adapter",
    "crates/klaar-geo-adapter",
    "crates/klaar-push-adapter",
    "crates/klaar-storage-adapter",
    "crates/klaar-av-adapter",
    "crates/klaar-audit-adapter",
    "crates/klaar-email-adapter",
    "crates/klaar-api",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
