# Sert la PWA et relaie l'API sur la **même origine** (Story 0.7).
#
# **La même origine n'est pas un détail de confort.** Le front appelle
# `/api/v1` en relatif ; le servir ailleurs demanderait du CORS, c'est-à-dire
# de relâcher une garantie de production pour une commodité de déploiement. Le
# cookie de rafraîchissement, lui, ne voyagerait pas du tout entre origines
# distinctes sans `SameSite=None`, qui est précisément ce qu'on ne veut pas.

server {
    listen 8081;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # **Redirections relatives.** nginx construit sinon un `Location` absolu
    # avec *son* port d'écoute — 8081 — alors que le client est arrivé par le
    # port publié de l'hôte. Le navigateur suit vers un port fermé et la page
    # ne s'ouvre pas. Constaté en interrogeant le déploiement : `/demande`
    # renvoyait vers `http://localhost:8081/demande/`.
    absolute_redirect off;

    # L'API, relayée vers le service. Le nom `service` est celui de la
    # composition ; il ne résout que sur son réseau interne.
    location /api/v1/ {
        # **Le nom est résolu à chaque requête, pas au démarrage.** nginx fige
        # sinon l'adresse du service au boot : quand le conteneur est recréé et
        # change d'adresse — ce qui arrive à chaque déploiement — le site répond
        # 502 jusqu'à ce que nginx redémarre. Passer par une variable force la
        # résolution dynamique, et `resolver` désigne le DNS interne du moteur
        # de conteneurs.
        #
        # Le défaut ne se voit pas au premier lancement, seulement au premier
        # redéploiement du service. C'est celui qu'on découvre en production.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $amont http://service:8080;
        proxy_pass $amont;
        proxy_http_version 1.1;

        # **Les en-têtes de socket, pour le temps réel (Story 4.9).** Sans
        # `Upgrade` et `Connection`, la connexion WebSocket est refusée par le
        # proxy et l'écran retombe sur le sondage sans dire pourquoi.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        # `X-Forwarded-For` n'a de valeur que si le service est configuré pour
        # le croire (`KLAAR_DERRIERE_PROXY`). Le poser sans cela est sans
        # effet ; le poser **et** exposer le service directement rendrait la
        # limitation de débit contournable par un simple en-tête.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Une socket ouverte n'échange rien pendant des minutes : le délai par
        # défaut de soixante secondes la couperait au milieu d'une intervention.
        proxy_read_timeout 3600s;

        # **Aucune mise en cache d'une réponse d'API.** Le catalogue porte ses
        # propres en-têtes de cache ; tout le reste est nominatif, et un cache
        # intermédiaire servirait à l'un ce qui était destiné à l'autre.
        proxy_buffering off;
    }

    # **Le service worker ne se met pas en cache.** Gardé une heure, il
    # empêche toute mise à jour d'atteindre les navigateurs déjà installés
    # pendant une heure — et ce sont ceux des gens qui se servent le plus de
    # l'application.
    #
    # Le nom est `service-worker.js`, celui que `registerSW.ts` enregistre.
    # Une première version visait `/sw.js`, qui n'existe pas : la règle ne
    # s'appliquait à rien et le fichier était servi avec le cache par défaut.
    # Le contrôle en interrogeant le déploiement l'a montré — l'en-tête
    # attendu était simplement absent.
    location = /service-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # Le manifeste change avec chaque version ; même raison.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # Les fichiers versionnés par empreinte se gardent longtemps : leur nom
    # change quand leur contenu change, il n'y a rien à invalider.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le site est généré statiquement : chaque page a son fichier. `$uri/`
    # sert `/demande/index.html`, et l'absence tombe sur la page hors-ligne
    # plutôt que sur le 404 de nginx, qui ne dirait rien d'utile.
    location / {
        try_files $uri $uri/ $uri.html /hors-ligne/index.html;
    }
}
